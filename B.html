  on_finish: function() {

    jsPsych.data.get().localSave(

  }

});

  intro_page,

  precheck,

  pre_questionnaire,

  addition_instruction_no_sound,

  createAdditionTask("no_sound"),

  post_questionnaire_no_sound_intro,

  post_questionnaire_no_sound,

  volume_check,

  expectation_instruction,

  manipulation_check,

  createAdditionTask("expectation_sound"),

  post_questionnaire_sound,

  debriefing
